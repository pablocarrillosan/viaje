name: Aviso de plazas en refugios

# Comprueba cada hora si hay sitio para las 4 personas en las noches de refugio
# del viaje (Respomuso 22, Góriz 25, Linza 28 y 29 de agosto de 2026).
#
# Cuando lo hay, abre una issue en el repo. GitHub envía el email del aviso por
# su cuenta, así que NO hacen falta credenciales de correo ni secretos.
#
# Si ya existe una issue abierta con el mismo título, no la duplica: solo añade
# un comentario si los números han cambiado.

on:
  schedule:
    - cron: '7 * * * *'   # cada hora, en el minuto 7
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: plazas-alerta
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: plazas
        name: Consultar disponibilidad
        run: node scripts/alerta-plazas.mjs

      - name: Abrir o actualizar la issue de aviso
        if: steps.plazas.outputs.hay == 'true'
        uses: actions/github-script@v7
        env:
          TITULO: ${{ steps.plazas.outputs.titulo }}
          CUERPO: ${{ steps.plazas.outputs.cuerpo }}
        with:
          script: |
            const titulo = process.env.TITULO
            const cuerpo = process.env.CUERPO

            const abiertas = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'plazas',
            })

            const yaExiste = abiertas.data.find((i) => i.title === titulo)

            if (yaExiste) {
              core.info(`Ya hay una issue abierta con este título (#${yaExiste.number}). No duplico.`)
              return
            }

            // ¿Hay alguna alerta previa abierta con otros números? La cerramos
            // para no acumular ruido, y abrimos la nueva con el dato al día.
            for (const vieja of abiertas.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: vieja.number,
                state: 'closed',
              })
              core.info(`Cerrada la alerta anterior #${vieja.number}`)
            }

            const nueva = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: titulo,
              body: cuerpo,
              labels: ['plazas'],
            })
            core.info(`Abierta la issue #${nueva.data.number}`)
