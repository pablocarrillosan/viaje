name: Deploy a GitHub Pages

on:
  push:
    branches: [master]
  # Refresco automático de la disponibilidad de refugios: cada hora se reconstruye
  # el sitio pidiendo las plazas a la API. No hace falta commitear nada ni tener
  # el ordenador encendido.
  # Va en el minuto 35 para no solaparse con plazas-alerta.yml (minuto 7).
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Plazas en refugios: se piden a la API en cada build para que la web
      # publicada lleve el dato fresco. Si la API falla o cambia, seguimos con
      # la instantánea commiteada en src/data/plazas.json — el build NO se rompe.
      - name: Refrescar disponibilidad de refugios
        continue-on-error: true
        run: npm run fetch:plazas

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
